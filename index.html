<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
const app=initializeApp({apiKey:"AIzaSyAA2CR7TLIwJ4vBK-kS6qavj93g3LvgQdU",authDomain:"nene-box.firebaseapp.com",projectId:"nene-box",storageBucket:"nene-box.firebasestorage.app",messagingSenderId:"582362181502",appId:"1:582362181502:web:17f4360f56a6f8a3a80d2f"});
const ADMIN_UID="zzy1kG02vkft00TTdRtfG6iMbNL2";
const market=document.getElementById("market"),warehouse=document.getElementById("warehouse"),warehouseTab=document.getElementById("warehouseTab");
let isAdmin=false;
const headerAdminBtn=document.getElementById("headerAdminBtn"),headerOrdersBtn=document.getElementById("headerOrdersBtn");
const headerOrdersBadge=document.getElementById("headerOrdersBadge");
function setShellOrdersBadge(count){count=Math.max(0,Number(count)||0);if(!headerOrdersBadge)return;headerOrdersBadge.textContent=String(count);headerOrdersBadge.hidden=count===0;}
window.addEventListener("message",event=>{if(event.source!==market.contentWindow)return;const data=event.data||{};if(data.type==="nene-orders-pending")setShellOrdersBadge(data.count);});
function clickMarketControl(id){
  try{const button=market.contentDocument?.getElementById(id);if(button){button.click();return;}}
  catch(error){console.error("無法操作賣場管理功能",error);}
  alert("賣場仍在載入，請稍後再試。");
}
const gear=document.getElementById("headerGear"),menu=document.getElementById("headerMenu");
function closeMenu(){menu.hidden=true;gear.setAttribute("aria-expanded","false");}
gear.addEventListener("click",()=>{menu.hidden=!menu.hidden;gear.setAttribute("aria-expanded",String(!menu.hidden));});
document.addEventListener("click",event=>{if(!event.target.closest(".header-admin-tools"))closeMenu();});
document.addEventListener("keydown",event=>{if(event.key==="Escape")closeMenu();});
headerAdminBtn.addEventListener("click",()=>{closeMenu();clickMarketControl("adminBtn");});
headerOrdersBtn.addEventListener("click",()=>{
  if(!isAdmin)return;
  show("market");
  requestAnimationFrame(()=>setTimeout(()=>clickMarketControl("ordersBtn"),40));
});
document.getElementById("headerBackupBtn").addEventListener("click",()=>{if(isAdmin){closeMenu();clickMarketControl("backupBtn");}});
document.getElementById("headerRestoreBtn").addEventListener("click",()=>{if(isAdmin){closeMenu();clickMarketControl("restoreBtn");}});
function show(id){
 if(id==="warehouse"&&!isAdmin)return;
 document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.id===id));
 market.classList.toggle("on",id==="market");warehouse.classList.toggle("on",id==="warehouse");
 if(id==="warehouse"&&!warehouse.getAttribute("src"))warehouse.src=warehouse.dataset.src;
}
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>show(b.dataset.id)));
onAuthStateChanged(getAuth(app),user=>{
 isAdmin=user?.uid===ADMIN_UID;
 document.body.classList.toggle("admin-view",isAdmin);
 warehouseTab.hidden=!isAdmin;
 warehouseTab.style.display=isAdmin?"":"none";
 headerOrdersBtn.hidden=!isAdmin;
 if(!isAdmin)setShellOrdersBadge(0);
 headerAdminBtn.textContent=isAdmin?"管理員登出":"管理員登入";
 closeMenu();
 if(!isAdmin){show("market");warehouse.removeAttribute("src");}
});
