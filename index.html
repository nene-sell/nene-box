<style>
:root{--bg:#ded0c5;--panel:#f7eee8;--line:#c8ad9b;--text:#49372e;--accent:#9f725c}

body{display:flex;flex-direction:column;overflow:hidden}

.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
#stage{position:relative;flex:1;min-height:0}
.appframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:white;visibility:hidden;pointer-events:none}
.appframe.active{visibility:visible;pointer-events:auto}
@media(max-width:620px){#top{height:56px;flex-basis:56px;padding:6px 8px;gap:7px}#brand{font-size:14px}.tab{font-size:12px;padding:8px 10px}}
</style>
