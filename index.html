*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,"Microsoft JhengHei",sans-serif;background:#ded0c5;color:#49372e}

<body><header><b>🤎內內選物所🤎</b><a class="header-dc" href="https://discord.com/users/868208720407040060" target="_blank" rel="noopener noreferrer" title="Discord 私訊內內"><span class="dc-round"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.54 5.34A16.3 16.3 0 0 0 15.44 4c-.18.32-.39.75-.53 1.09a15.2 15.2 0 0 0-4.81 0A11.7 11.7 0 0 0 9.56 4a16.5 16.5 0 0 0-4.11 1.35C2.85 9.2 2.15 12.95 2.5 16.65a16.7 16.7 0 0 0 5.03 2.54c.41-.55.77-1.14 1.08-1.76-.59-.22-1.15-.49-1.69-.81.14-.1.28-.21.41-.32 3.26 1.51 6.8 1.51 10.02 0 .14.11.22.27.32-.54.32-1.11.59-1.69.81.31.62.67 1.21 1.08 1.76a16.6 16.6 0 0 0 5.03-2.54c.42-4.29-.72-8-2.64-11.31ZM8.68 14.38c-.98 0-1.79-.9-1.79-2s.79-2 1.79-2 1.81.91 1.79 2c0 1.1-.79 2-1.79 2Zm6.64 0c-.98 0-1.79-.9-1.79-2s.79-2 1.79-2 1.81.91 1.79 2c0 1.1-.79 2-1.79 2Z"/></svg></span>點我私訊 ♡</a><div class="tabs">

</main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
const app=initializeApp({apiKey:"AIzaSyAA2CR7TLIwJ4vBK-kS6qavj93g3LvgQdU",authDomain:"nene-box.firebaseapp.com",projectId:"nene-box",storageBucket:"nene-box.firebasestorage.app",messagingSenderId:"582362181502",appId:"1:582362181502:web:17f4360f56a6f8a3a80d2f"});
const ADMIN_UID="zzy1kG02vkft00TTdRtfG6iMbNL2";
const market=document.getElementById("market"),warehouse=document.getElementById("warehouse"),warehouseTab=document.getElementById("warehouseTab");
let isAdmin=false;
function show(id){
 if(id==="warehouse"&&!isAdmin)return;
 document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.id===id));
 market.classList.toggle("on",id==="market");warehouse.classList.toggle("on",id==="warehouse");
 if(id==="warehouse"&&!warehouse.getAttribute("src"))warehouse.src=warehouse.dataset.src;
}
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>show(b.dataset.id)));
onAuthStateChanged(getAuth(app),user=>{
 isAdmin=user?.uid===ADMIN_UID;
 document.body.classList.toggle("admin-view",isAdmin);
 warehouseTab.hidden=!isAdmin;
 if(!isAdmin){show("market");warehouse.removeAttribute("src");}
});
</script></body></html>
