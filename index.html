<style>

.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.stage{position:relative;flex:1;min-height:0}
.frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;display:none}
.frame.active{display:block}
@media(max-width:620px){.top{height:58px;flex-basis:58px;padding:7px 9px;gap:8px}.brand{font-size:15px}.tab{padding:8px 11px;font-size:13px}}
</style>

function decodeUtf8(b64){
  const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  return new TextDecoder("utf-8").decode(bytes);
}
document.getElementById("market").srcdoc=decodeUtf8(marketB64);
document.getElementById("warehouse").srcdoc=decodeUtf8(warehouseB64);

document.querySelectorAll(".tab").forEach(btn=>btn.addEventListener("click",()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===btn));
  document.querySelectorAll(".frame").forEach(x=>x.classList.toggle("active",x.id===btn.dataset.target));
}));
</script>
