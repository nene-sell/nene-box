<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>🤎內內選物所🤎</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,"Microsoft JhengHei",sans-serif;background:#ded0c5;color:#49372e}
body{display:flex;flex-direction:column;overflow:hidden}
header{display:flex;height:62px;flex:none;align-items:center;gap:12px;padding:8px 14px;background:#f7eee8;border-bottom:1px solid #c8ad9b}
body.admin-view header{display:flex}header b{white-space:nowrap}.header-dc{display:inline-flex;align-items:center;gap:5px;border:1px solid #e8d2ca;border-radius:999px;background:#fff8f5;color:#b7837e;padding:3px 9px 3px 4px;text-decoration:none;font-size:12px;font-weight:700;white-space:nowrap;line-height:1.3}.header-dc:hover{background:#f9ede8}.header-dc .dc-round{display:inline-flex;width:23px;height:23px;align-items:center;justify-content:center;border-radius:50%;overflow:hidden;background:#c5a995}.header-dc .dc-round .dc-symbol{width:16px;height:16px;display:block;color:white;fill:white}.tabs{display:flex;gap:7px}
.tab{border:1px solid #c8ad9b;border-radius:999px;padding:9px 13px;background:#fff7f2;color:#49372e;font-weight:800;cursor:pointer}
.tab.on{background:#9f725c;color:#fff}
body.admin-view .header-dc{display:none!important}
/* Small, quiet admin gear at far right; no duplicate toolbar. */
.header-admin-tools{margin-left:auto;position:relative;flex:none;display:flex;align-items:center;gap:7px}
.header-orders{height:31px;border:1px solid #dcc7b9;border-radius:9px;background:#fff7f2;color:#6d5142;padding:0 11px;font-size:12px;font-weight:800;cursor:pointer;align-items:center;justify-content:center;white-space:nowrap}
.header-orders:hover{background:#eaded4}
.header-gear{width:31px;height:31px;border:1px solid #dcc7b9;border-radius:9px;background:#f5eae1;color:#927562;display:grid;place-items:center;cursor:pointer;font-size:15px;padding:0}
.header-gear:hover{background:#eaddd2}
.header-menu{position:absolute;right:0;top:calc(100% + 9px);width:166px;padding:7px;background:#fffaf6;border:1px solid #dfcbbd;border-radius:12px;box-shadow:0 8px 25px #49372e24;z-index:200;display:flex;flex-direction:column;gap:4px}
.header-menu[hidden]{display:none!important}
.header-tool{display:flex;align-items:center;justify-content:flex-start;width:100%;border:0;border-radius:8px;padding:10px;background:transparent;color:#654a3c;font-size:13px;font-weight:700;white-space:nowrap;cursor:pointer;text-decoration:none}
.header-tool:hover{background:#f0e4da}.header-tool:disabled{opacity:.5;cursor:wait}
header .admin-only{display:none!important}
body.admin-view header .admin-only{display:inline-flex!important}
[hidden]{display:none!important}
main{position:relative;flex:1;min-height:0}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;visibility:hidden;pointer-events:none}
iframe.on{visibility:visible;pointer-events:auto}
@media(max-width:620px){header{height:auto;min-height:56px;padding:6px 8px;gap:7px;flex-wrap:wrap}header b{font-size:14px}.tab{font-size:12px;padding:8px 10px}}
</style></head>
<body><header><b>🤎內內選物所🤎</b><a class="header-dc" href="https://discord.com/users/868208720407040060" target="_blank" rel="noopener noreferrer" title="Discord 私訊內內"><span class="dc-round"><svg class="dc-symbol" viewBox="0 0 24 24"><path fill="currentColor" d="M19.54 5.34A16.3 16.3 0 0 0 15.44 4c-.18.32-.39.75-.53 1.09a15.2 15.2 0 0 0-4.81 0A11.7 11.7 0 0 0 9.56 4a16.5 16.5 0 0 0-4.11 1.35C2.85 9.2 2.15 12.95 2.5 16.65a16.7 16.7 0 0 0 5.03 2.54c.41-.55.77-1.14 1.08-1.76-.59-.22-1.15-.49-1.69-.81.14-.1.28-.21.41-.32 3.26 1.51 6.8 1.51 10.02 0 .14.11.27.22.41.32-.54.32-1.11.59-1.69.81.31.62.67 1.21 1.08 1.76a16.6 16.6 0 0 0 5.03-2.54c.42-4.29-.72-8-2.64-11.31ZM8.68 14.38c-.98 0-1.79-.9-1.79-2s.79-2 1.79-2 1.81.91 1.79 2c0 1.1-.79 2-1.79 2Zm6.64 0c-.98 0-1.79-.9-1.79-2s.79-2 1.79-2 1.81.91 1.79 2c0 1.1-.79 2-1.79 2Z"/></svg></span>點我私訊 ♡</a><div class="tabs">
<button class="tab on" data-id="market">販售與收購</button><button class="tab admin-only" data-id="warehouse" id="warehouseTab" hidden>小倉倉</button>
</div><div class="header-admin-tools"><button type="button" class="header-orders admin-only" id="headerOrdersBtn" hidden>訂單</button><button type="button" class="header-gear" id="headerGear" aria-label="管理設定" aria-expanded="false" aria-controls="headerMenu" title="管理設定">⚙</button><div class="header-menu" id="headerMenu" hidden><button type="button" class="header-tool" id="headerAdminBtn">管理員登入</button><button type="button" class="header-tool admin-only" id="headerBackupBtn">完整備份</button><button type="button" class="header-tool admin-only" id="headerRestoreBtn">還原備份</button><a class="header-tool admin-only" href="backup.html" id="headerSiteBackupBtn">整站備份</a></div></div></header><main>
<iframe id="market" class="on" title="販售與收購" src="market.html?v=20261002-stock-orders-v1"></iframe>
<iframe id="warehouse" title="小倉倉" data-src="warehouse.html?v=20261001-swap-fixed-position-v5"></iframe>
</main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
const app=initializeApp({apiKey:"AIzaSyAA2CR7TLIwJ4vBK-kS6qavj93g3LvgQdU",authDomain:"nene-box.firebaseapp.com",projectId:"nene-box",storageBucket:"nene-box.firebasestorage.app",messagingSenderId:"582362181502",appId:"1:582362181502:web:17f4360f56a6f8a3a80d2f"});
const ADMIN_UID="zzy1kG02vkft00TTdRtfG6iMbNL2";
const market=document.getElementById("market"),warehouse=document.getElementById("warehouse"),warehouseTab=document.getElementById("warehouseTab");
let isAdmin=false;
const headerAdminBtn=document.getElementById("headerAdminBtn"),headerOrdersBtn=document.getElementById("headerOrdersBtn");
function clickMarketControl(id){
  try{const button=market.contentDocument?.getElementById(id);if(button){button.click();return;}}
  catch(error){console.error("無法操作賣場管理功能",error);}
  alert("賣場仍在載入，請稍後再試。");
}
const gear=document.getElementById("headerGear"),menu=document.getElementById("headerMenu");
function closeMenu(){menu.hidden=true;gear.setAttribute("aria-expanded","false");}
gear.addEventListener("click",()=>{menu.hidden=!menu.hidden;gear.setAttribute("aria-expanded",String(!menu.hidden));});
document.addEventListener("click",event=>{if(!event.target.closest(".header-admin-tools"))closeMenu();});
document.addEventListener("keydown",event=>{if(event.key==="Escape")closeMenu();});
headerAdminBtn.addEventListener("click",()=>{closeMenu();clickMarketControl("adminBtn");});
headerOrdersBtn.addEventListener("click",()=>{
  if(!isAdmin)return;
  show("market");
  requestAnimationFrame(()=>setTimeout(()=>clickMarketControl("ordersBtn"),40));
});
document.getElementById("headerBackupBtn").addEventListener("click",()=>{if(isAdmin){closeMenu();clickMarketControl("backupBtn");}});
document.getElementById("headerRestoreBtn").addEventListener("click",()=>{if(isAdmin){closeMenu();clickMarketControl("restoreBtn");}});
function show(id){
 if(id==="warehouse"&&!isAdmin)return;
 document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.id===id));
 market.classList.toggle("on",id==="market");warehouse.classList.toggle("on",id==="warehouse");
 if(id==="warehouse"&&!warehouse.getAttribute("src"))warehouse.src=warehouse.dataset.src;
}
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>show(b.dataset.id)));
onAuthStateChanged(getAuth(app),user=>{
 isAdmin=user?.uid===ADMIN_UID;
 document.body.classList.toggle("admin-view",isAdmin);
 warehouseTab.hidden=!isAdmin;
 headerOrdersBtn.hidden=!isAdmin;
 headerAdminBtn.textContent=isAdmin?"管理員登出":"管理員登入";
 closeMenu();
 if(!isAdmin){show("market");warehouse.removeAttribute("src");}
});
</script></body></html>
